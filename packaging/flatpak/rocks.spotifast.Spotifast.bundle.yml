# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as rocks.spinity.Spotifast.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: rocks.spinity.Spotifast
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: spinity
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # Platform storage for this application's Spotify grants.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.spinity
  - --persist=.local/state
modules:
  - name: spinity
    buildsystem: simple
    build-commands:
      - install -Dm755 spinity /app/bin/spinity
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/rocks.spinity.Spotifast.desktop
      - sed -i 's/^Icon=.*$/Icon=rocks.spinity.Spotifast/;s/^StartupWMClass=spinity$/StartupWMClass=rocks.spinity.Spotifast/' /app/share/applications/rocks.spinity.Spotifast.desktop
      - install -Dm644 packaging/icons/*.svg /app/share/icons/hicolor/scalable/apps/rocks.spinity.Spotifast.svg
      - install -Dm644 packaging/flatpak/rocks.spinity.Spotifast.metainfo.xml /app/share/metainfo/rocks.spinity.Spotifast.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/spinity/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: rocks.spinity.Spotifast.metainfo.xml
        dest: packaging/flatpak
