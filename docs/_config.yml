theme: jekyll-theme-minimal

# Site settings
title: Spinity
name: Spinity
description: >-
  A native Spotify client, fast and lightweight.

# Site navigation
navigation:
  - text: Home
    link: /
  - text: Download
    link: /download/
  - text: Getting started
    link: /getting-started/
  - text: User guide
    link: /using-spinity/
  - text: More
    link: /more/

# Site author
author:
  name: Yield Studio
  email: 
  url: https://github.com/Yield-Studio/spinity1

# Site URLs
url: https://github.com/Yield-Studio/spinity1
baseurl: ""

# Repository settings for GitHub Pages
repository: Yield-Studio/spinity1

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .git/
  - .github/
  - LICENSE
  - README.md

# Plugins
gems:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections
defaults:
  - scope:
      path: ""
      type: "_guide"
    values:
      layout: "guide"
      permalink: /:path/

# Redirects
redirect_from:
  json: false
